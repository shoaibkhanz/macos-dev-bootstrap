onboarding = false
# herdr config

[keys]
# Prefix key (herdr default). Press it, release, then the bound key.
prefix = "ctrl+a"

# prefix+j / prefix+k are repurposed below for agent navigation, so disable the
# default focus_pane_down/up (prefix+j/k) to avoid key conflicts. Pane movement
# is handled by Ctrl+h/j/k/l (vim-nav plugin), not the prefix.
focus_pane_down = ""
focus_pane_up = ""

# Cycle TABS with DIRECT Ctrl+n / Ctrl+p (next / previous), matching the
# Ctrl+hjkl direct-chord flow — no prefix. These rebind herdr's built-in
# next_tab / previous_tab (default prefix+n / prefix+p), so those prefix chords
# no longer switch tabs.
# CAVEAT 1 (if these do nothing): rebinding a BUILT-IN action is startup-only —
#   `herdr server reload-config` will NOT pick it up. Detach + reattach the
#   client (ctrl+a q, then `herdr`) or `herdr server stop` and relaunch.
# CAVEAT 2: the terminal may swallow Ctrl+n/Ctrl+p; if so, try alt+n / alt+p.
# CAVEAT 3: herdr captures these globally, so <C-n>/<C-p> completion in Neovim
#   and Ctrl+p/Ctrl+n history in shells/fzf are shadowed inside panes. To get
#   them back, set these to "" (or use alt+n / alt+p).
next_tab = "ctrl+n"
previous_tab = "ctrl+p"

# Active Agent Jump plugin (github: shoaibkhanz/herdr-active-agent-jump, installed
# as `active-agent.jump`): cycle focus through ACTIVE agents (working or blocked).
# j = next, k = previous. Press ctrl+a, release, then j / k.
[[keys.command]]
key = "prefix+j"
type = "plugin_action"
command = "active-agent.jump.next"
description = "Jump to next active agent"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "active-agent.jump.previous"
description = "Jump to previous active agent"

# Attention Jump plugin (github: milkyskies/herdr-attention): warp to the most
# urgent agent needing attention (blocked, then done); repeated presses cycle.
# a = "attention". Press ctrl+a, release, then a.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "attention.jump.next"
description = "Jump to next agent needing attention"

# herdr-nav-plus plugin (github: shoaibkhanz/herdr-nav-plus): seamless Ctrl+h/j/k/l.
# Strict superset of vim-herdr-navigation — keeps vim<->pane behaviour, and on the
# vertical axis (j/k) walks the WORKSPACE sidebar (wrapping at both ends) at the
# pane-grid edge. DIRECT chords (no prefix). The plugin ships no manifest keys, so
# these entries are REQUIRED. (Do not also bind vim-herdr-navigation.* to these keys.)
#
# Every plugin bound below is installed by ../install.sh (HERDR_PLUGINS) — a
# binding whose plugin is missing resolves to `plugin_not_found` and the key
# silently does nothing. Check with `herdr plugin list`.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nav-plus.left"
description = "navigate left (vim/pane)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nav-plus.down"
description = "navigate down (vim/pane/space/agent)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nav-plus.up"
description = "navigate up (vim/pane/space/agent)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nav-plus.right"
description = "navigate right (vim/pane)"

# herdr-radar plugin (github: hhdebb/herdr-radar): readable Agents panel —
# vendor logo per row, state colour, worktree trees, activity ordering.
# prefix+a is already taken by attention.jump, so the README's suggested key
# for the order flip moves to prefix+f ("flip"). prefix+comma is herdr's own
# suggestion and is free in both herdr's defaults and this file.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "hhdebb.herdr-radar.view-flip"
description = "Agents panel order: active <-> recent"

[[keys.command]]
key = "prefix+comma"
type = "plugin_action"
command = "hhdebb.herdr-radar.settings"
description = "herdr-radar settings popup"

[theme]
# Base theme. [theme.custom] below overrides individual tokens on top of it.
# Restored to vesper 2026-09-16: herdr-radar's theme-sync drove this to
# "catppuccin" on install. `follow_appearance = false` in its plugin config
# now stops that.
name = "vesper"
auto_switch = false

# === Active palette: Yugen True (mirrored in herdr/themes/yugen-true.toml) ===
# herdr's chrome matched to the Yugen colorscheme (nvim) on pure black, so herdr
# sits seamlessly around black Ghostty and Yugen nvim. Accent is Yugen's peach.
# herdr-picker-plus reads this block too, so one palette themes both.
# To switch: paste another block from herdr/themes/ over this one, then `hdrc`.
#
# LOAD BEARING BEYOND THEMING — do not delete or relocate this block without
# reading this. herdr-radar declares [theme.custom] itself, and TOML forbids
# declaring a table twice, so while a hand-written copy sits HERE (outside the
# plugin's `# >>>` markers) the plugin's apply() refuses with `foreign-table`
# and returns before writing anything. That refusal is the only thing keeping
# it out of this file. Remove the block and apply() succeeds — it writes via
# temp-file + rename, which REPLACES the ~/.config/herdr/config.toml symlink
# with a detached copy, and it can fire unattended: the daemon calls apply()
# on every start whose OS light/dark variant differs from the block's tag.
# If you ever do move the palette, re-link afterwards: `./install.sh --herdr`.
[theme.custom]
panel_bg    = "#000000"
surface_dim = "#000000"
surface0    = "#0e0e0e"
surface1    = "#1a1a1a"
overlay0    = "#444444"
overlay1    = "#777777"
text        = "#d4d4d4"
subtext0    = "#888888"
accent      = "#ffbe89"
green       = "#7eab8e"
yellow      = "#d8b46f"
red         = "#cf8b82"
blue        = "#87afff"
teal        = "#7fb0a6"
mauve       = "#b294bb"
peach       = "#ffbe89"

[ui]
show_agent_labels_on_pane_borders = true
tab_bar_position = "bottom"
pane_scrollbars = false
hide_tab_bar_when_single_tab = true

# Accent for highlights, borders, and navigation UI — Yugen peach, matching
# [theme.custom], instead of herdr's default cyan.
accent = "#ffbe89"

# Draw pane borders, but share dividers instead of leaving gaps (tighter).
pane_borders = true
pane_gaps = false

# Agent panel ordering: "spaces" (grouped by space) or "priority" (attention
# queue: blocked/error → needs-you → done → working → idle). Priority floats
# whatever needs you to the top, which is the point with several agents running.
# NOTE: the companion `agent_panel_scope` key no longer exists (gone as of
# 0.8.0) — scope is now a sidebar toggle only, so do not re-add it.
agent_panel_sort = "priority"

[ui.toast]
# off | herdr (in-app) | terminal (outer terminal, survives SSH) | system (OS).
# system = real macOS notifications when an agent finishes or needs you, which
# is the whole point when herdr is not the focused window. On macOS herdr tries
# terminal-notifier (in ../Brewfile — it can also raise the terminal on click)
# and falls back to osascript, which shows up as "Script Editor".
delivery = "system"

[experimental]
switch_ascii_input_source_in_prefix = false
pane_history = true
# Experimental local Kitty graphics rendering for attached clients (ghostty-capable).
kitty_graphics = true

[update]
channel = "stable"

