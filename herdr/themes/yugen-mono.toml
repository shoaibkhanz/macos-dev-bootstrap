# Yugen Mono
# Greyscale chrome; the only colour is the herd's status (working/blocked/done).
# Accent is a neutral bright grey, so selection reads as "brighter", not coloured.
# Paste this block over [theme.custom] in ../config.toml, then run `hdrc`.
[theme.custom]
panel_bg    = "#000000"
surface_dim = "#000000"
surface0    = "#0e0e0e"
surface1    = "#1a1a1a"
overlay0    = "#444444"
overlay1    = "#777777"
text        = "#d4d4d4"
subtext0    = "#888888"
accent      = "#e6e6e6"
green       = "#7eab8e"
yellow      = "#d8b46f"
red         = "#cf8b82"
blue        = "#87afff"
teal        = "#7fb0a6"
mauve       = "#b294bb"
peach       = "#ffbe89"
